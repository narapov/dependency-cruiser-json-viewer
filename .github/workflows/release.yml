name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump
        required: true
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: write
  id-token: write # required for npm Trusted Publisher (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # GITHUB_TOKEN cannot push to a protected main branch; RELEASE_PAT must
      # belong to a user allowed to bypass branch protection (repo admin or
      # ruleset exception). Create a classic PAT with "repo" scope.
      # RELEASE_PAT is also used for GitHub Release via release-it.
      # npm publish uses Trusted Publisher (OIDC) — no npm token needed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT }}
      - run: git checkout main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: |
          if [ "${{ inputs.release_type }}" = "auto" ]; then
            npm run release:ci
          else
            npm run release:ci -- ${{ inputs.release_type }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
      # Fail the workflow if release-it did not push to origin/main (e.g. branch
      # protection or PAT permissions blocked the push while earlier steps succeeded).
      - name: Verify release commit reached main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
